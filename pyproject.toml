[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-decode"
version = "0.1.0"
description = "Decode what your winning short-form videos say and show that your losing ones don't: transcripts, typed script labels, a winners-vs-losers page, and a brief gate for the next script."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "reel-decode contributors" }]
keywords = ["reels", "shorts", "tiktok", "short-form video", "content analytics", "whisper", "creator tools", "hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pyyaml>=6",
  "requests>=2.28",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
fetch = ["yt-dlp"]
transcribe = ["openai-whisper"]
visual = ["opencv-python-headless>=4.8,<5", "numpy"]  # 5.x removed the Haar face detector
collect = ["playwright>=1.40"]
youtube = ["google-api-python-client>=2", "google-auth>=2"]
all = ["reel-decode[fetch,transcribe,visual,collect,youtube]"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
reeldecode = "reeldecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reeldecode = ["templates/*", "demo_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731", "E501", "E402", "B905"]
