formula_exception: ''   # only for a deliberate test of another shape: say why
script:
  hook: ''              # first 2 seconds, on screen and spoken, 12 words max
  sub_hook: ''          # promise of a clear payoff: "in the next 30 seconds I'll show you..."
  story:
    character: ''       # who this happens to (a real person, real data)
