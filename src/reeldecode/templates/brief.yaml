  reward: ''            # the payoff the sub-hook promised, delivered late
  personal_payoff: ''   # what this does for YOU, the viewer, in one sentence
  cta:
    type: ''            # tofu: question|follow|send|save · mofu: + comment_keyword · bofu: comment_keyword|link_in_bio|dm
